# Modèle de thème Rio, rendu par Noctalia (Matugen).
# Ne pas éditer le fichier généré : il est écrit dans ~/.config/rio/themes/noctalia.toml.
# Géré par home/terminals.nix (noctalia/rio.toml).

[colors]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
cursor = "{{colors.primary.default.hex}}"
selection-background = "{{colors.secondary_container.default.hex}}"
selection-foreground = "{{colors.on_secondary_container.default.hex}}"

tabs = "{{colors.on_surface_variant.default.hex}}"
tabs-active = "{{colors.primary.default.hex}}"
bar = "{{colors.surface_container_low.default.hex}}"
split = "{{colors.outline_variant.default.hex}}"

black = "{{colors.surface_container_high.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.primary.default.hex}}"
magenta = "{{colors.on_primary_container.default.hex}}"
cyan = "{{colors.on_secondary_container.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"

light-black = "{{colors.outline.default.hex}}"
light-red = "{{colors.error.default.hex}}"
light-green = "{{colors.tertiary.default.hex}}"
light-yellow = "{{colors.secondary.default.hex}}"
light-blue = "{{colors.primary.default.hex}}"
light-magenta = "{{colors.on_primary_container.default.hex}}"
light-cyan = "{{colors.on_secondary_container.default.hex}}"
light-white = "{{colors.on_surface.default.hex}}"
