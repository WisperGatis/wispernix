# Matugen : génère les couleurs Waybar et Rofi depuis le fond d'écran.
# Lancé par wallpaper-menu (home/hyprland.nix).

[config]

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors.css"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Palette JSON lue par l'extension navigateur (browser-extension/).
[templates.web_palette]
input_path = "~/.config/matugen/templates/web-palette.json"
output_path = "~/.config/web-palette/palette.json"
