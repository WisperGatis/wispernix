
# =========================
# MangoWM config
# Wispie-chan edition 💜
# Noctalia V5 + Rio BLZ
# Format TOML
# =========================

[global]

###########
# Moniteurs
###########

# Les règles des moniteurs se trouvent plus bas
# dans [[rule.monitor_rule]].

###############
# Environnement
###############

# Curseur Rio BLZ
# Les variables d'environnement sont définies
# dans la section [env].

#########################
# Clavier / disposition
#########################

xkb_rules_layout = "ch"
xkb_rules_variant = "fr"

###############################
# Apparence / gaps / bordures
###############################

# Espacement intérieur entre les fenêtres
gap_inner_horizontal = 5
gap_inner_vertical = 5

# Espacement extérieur entre fenêtres et écrans
gap_outer_horizontal = 10
gap_outer_vertical = 10

# Épaisseur des bordures
border_px = 3

#####################################
# Effets de fenêtre (blur, opacité)
#####################################

blur = 1
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 6

border_radius = 14
focused_opacity = 0.92
unfocused_opacity = 0.75

################
# Layout / tags
################

# Dix workspaces avec disposition tile
tag_num = 10

# Les règles de disposition sont définies
# plus bas dans [[rule.tag_rule]].

#############
# Autostart
#############

# Shell Noctalia V5
# Agent Polkit GNOME
# Curseur Rio BLZ
# Historique du presse-papiers (texte et images)

exec_once = [
    "noctalia",
    "/home/wisp/.local/bin/polkit-gnome-agent",
    'gsettings set org.gnome.desktop.interface cursor-theme "Rio BLZ"',
    "gsettings set org.gnome.desktop.interface cursor-size 24",
    "wl-paste --type text --watch cliphist store",
    "wl-paste --type image --watch cliphist store"
]

##############################
# Fichiers de configuration
##############################

# Thème Noctalia V5 pour MangoWM
# Fichier généré au format .conf
# Les couleurs devront être adaptées séparément.
source = ["/home/wisp/.config/mango/noctalia.conf"]

# DMS Include Configs
# source = ["./dms/cursor.conf", "./dms/layout.conf"]


###############
# Environnement
###############

[env]

# Curseur Rio BLZ
# "XCURSOR_PATH" = "/usr/share/icons:/home/wisp/.local/share/icons"
# "XCURSOR_THEME" = "Rio BLZ"
# "XCURSOR_SIZE" = "24"


###########
# Moniteurs
###########

# Samsung Electric Company LC24RG50 HNMT100624

[[rule.monitor_rule]]
make = "Samsung Electric Company"
model = "LC24RG50"
serial = "HNMT100624"
width = 1920
height = 1080
refresh = 143.981
x = 0
y = 0
scale = 1
vrr = 1
rr = 0

# HP Inc. OMEN by HP 25 3CQ95007KT

[[rule.monitor_rule]]
make = "HP Inc."
model = "OMEN by HP 25"
serial = "3CQ95007KT"
width = 1920
height = 1080
refresh = 143.992
x = 1920
y = 0
scale = 1
vrr = 1
rr = 0


################
# Layout / tags
################

# Chaque workspace utilise le layout tile.

[[rule.tag_rule]]
id = 1
layout_name = "tile"

[[rule.tag_rule]]
id = 2
layout_name = "tile"

[[rule.tag_rule]]
id = 3
layout_name = "tile"

[[rule.tag_rule]]
id = 4
layout_name = "tile"

[[rule.tag_rule]]
id = 5
layout_name = "tile"

[[rule.tag_rule]]
id = 6
layout_name = "tile"

[[rule.tag_rule]]
id = 7
layout_name = "tile"

[[rule.tag_rule]]
id = 8
layout_name = "tile"

[[rule.tag_rule]]
id = 9
layout_name = "tile"

[[rule.tag_rule]]
id = 10
layout_name = "tile"


############################
# Raccourcis Noctalia / DMS
############################

[bind.default]

# Win+Space : launcher Noctalia
"SUPER+space" = "spawn_shell,noctalia msg panel-toggle launcher"

# Win+Alt+Space : launcher DMS
"SUPER+ALT+space" = "spawn_shell,dms ipc call launcher toggle"

# Win+O : settings Noctalia
"SUPER+o" = "spawn_shell,noctalia msg settings-toggle"

# Win+Alt+O : settings DMS
"SUPER+ALT+o" = "spawn_shell,dms ipc call settings toggle"

# Win+V : clipboard Noctalia
"SUPER+v" = "spawn_shell,noctalia msg panel-toggle clipboard"

# Win+E : control center Noctalia
"SUPER+e" = "spawn_shell,noctalia msg panel-toggle control-center"

# Win+Alt+E : control center DMS
"SUPER+ALT+e" = "spawn_shell,dms ipc call controlCenter toggle"


########################
# Fenêtres / navigation
########################

# Win+Q : fermer la fenêtre focus
"SUPER+q" = "killclient"

# Win+Tab : focusstack next
"SUPER+Tab" = "focusstack,next"

# Win+Shift+F : toggle plein écran
"SUPER+SHIFT+f" = "togglefullscreen"

# Win+Shift+A / D : changer l'écran focus
"SUPER+SHIFT+a" = "focusmon,left"
"SUPER+SHIFT+d" = "focusmon,right"


#############
# Workspaces
#############

# Win+1 à Win+0 : afficher les tags 1 à 10

"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
"SUPER+0" = "view,10,0"


#############
# Programmes
#############

# Win+T : ouvrir un terminal
# Kitty prioritaire, puis Alacritty, Ghostty et Foot
"SUPER+t" = "spawn_shell,kitty || alacritty || ghostty || foot"

# Print Screen : screenshot Noctalia V5
"Print" = "spawn_shell,noctalia msg screenshot-region"


#######################
# Raccourcis système
#######################

# Reload config
"SUPER+r" = "reload_config"

# Quitter MangoWM
"SUPER+m" = "quit"

# Activer et désactiver le mode flottant
"SUPER+f" = "togglefloating"


################
# Mouse bindings
################

[mousebind.default]

# Win + clic gauche : déplacer une fenêtre
"SUPER+btn_left" = "moveresize,curmove"

# Win + clic droit : redimensionner une fenêtre
"SUPER+btn_right" = "moveresize,curresize"

