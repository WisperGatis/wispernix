# =========================
#  MangoWM config
#  Wispie-chan edition 💜
#  Noctalia V5 + Rio BLZ
# =========================


###########
# Moniteurs
###########

# Samsung Electric Company LC24RG50 HNMT100624
monitorrule=make:Samsung Electric Company,model:LC24RG50,serial:HNMT100624,width:1920,height:1080,refresh:143.981,x:0,y:0,scale:1,vrr:1,rr:0

# HP Inc. OMEN by HP 25 3CQ95007KT
monitorrule=make:HP Inc.,model:OMEN by HP 25,serial:3CQ95007KT,width:1920,height:1080,refresh:143.992,x:1920,y:0,scale:1,vrr:1,rr:0

###############
# Environnement
###############

# Curseur Rio BLZ
#env=XCURSOR_PATH,/usr/share/icons:/home/wisp/.local/share/icons
#env=XCURSOR_THEME,Rio BLZ
#env=XCURSOR_SIZE,24

#####################
# Clavier / disposition
#####################

xkb_rules_layout=ch
xkb_rules_variant=fr

###########################
# Apparence / gaps / bordures
###########################

gappih=5
gappiv=5
gappoh=10
gappov=10

borderpx=3

###########################
# Effets de fenêtre (blur, opacité)
###########################

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=6

border_radius=14
focused_opacity=0.92
unfocused_opacity=0.75

################
# Layout / tags
################

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tagrule=id:10,layout_name:tile

#############
# Autostart
#############

# Shell Noctalia V5
exec-once=noctalia

# Polkit
exec-once=/home/wisp/.local/bin/polkit-gnome-agent


# Curseur Rio BLZ — appliqué via gsettings pour GTK3/GTK4 et apps compatibles
exec-once=gsettings set org.gnome.desktop.interface cursor-theme "Rio BLZ"
exec-once=gsettings set org.gnome.desktop.interface cursor-size 24

cursor_theme=Aemeath
cursor_size=24

# Clipboard history
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

############################
# Raccourcis Noctalia / DMS
############################

# Win+Space : launcher Noctalia
bind=SUPER,space,spawn_shell,noctalia msg panel-toggle launcher

# Win+Alt+Space : launcher DMS
bind=SUPER+ALT,space,spawn_shell,dms ipc call launcher toggle

# Win+O : settings Noctalia
bind=SUPER,o,spawn_shell,noctalia msg settings-toggle

# Win+Alt+O : settings DMS
bind=SUPER+ALT,o,spawn_shell,dms ipc call settings toggle

# Win+V : clipboard Noctalia
bind=SUPER,v,spawn_shell,noctalia msg panel-toggle clipboard

# Win+E : control center Noctalia
bind=SUPER,e,spawn_shell,noctalia msg panel-toggle control-center

# Win+Alt+E : control center DMS
bind=SUPER+ALT,e,spawn_shell,dms ipc call controlCenter toggle

########################
# Fenêtres / navigation
########################

# Win+Q : fermer la fenêtre focus
bind=SUPER,q,killclient,

# Win+Tab : focusstack next
bind=SUPER,Tab,focusstack,next

# Win+Shift+F : toggle plein écran
bind=SUPER+SHIFT,f,togglefullscreen,

# Win+Shift+← / → : changer l'écran focus
bind=SUPER+SHIFT,a,focusmon,left
bind=SUPER+SHIFT,d,focusmon,right

#############
# Workspaces
#############

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

#############
# Programmes
#############

# Win+T : ouvrir un terminal
bind=SUPER,t,spawn_shell,kitty || alacritty || ghostty || foot

# Print Screen : screenshot Noctalia V5
bind=NONE,Print,spawn_shell,noctalia msg screenshot-region

#######################
# Raccourcis système
#######################

# Reload config
bind=SUPER,r,reload_config

# Quitter MangoWM
bind=SUPER,m,quit

# Activer et désactiver le mode flottant
bind=SUPER,f,togglefloating,

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# This sources the noctalia theme
source=/home/wisp/.config/mango/noctalia.conf

# This sources the noctalia theme

source = /home/wisp/.config/mango/noctalia.conf


# DMS Include Configs
# source=./dms/cursor.conf
# source=./dms/layout.conf
