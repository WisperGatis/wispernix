"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

add_newline = false

# Tout le prompt reste à gauche, sur une seule ligne.
format = """
$os$directory$git_branch$git_status$nix_shell$python$nodejs$rust$golang$cmd_duration$jobs$character"""

# Côté droit (zsh) : code de sortie en cas d'échec, puis l'heure.
right_format = """
$status$time"""

[os]
disabled = false
format = "[$symbol](bold blue) "

[os.symbols]
NixOS = ""

[directory]
# Garde jusqu'à 8 segments dans le chemin.
truncation_length = 8

# Ne coupe pas le chemin au root d'un dépôt Git.
truncate_to_repo = false

# Abrège les dossiers parents à une lettre ; garde le dossier actuel entier.
fish_style_pwd_dir_length = 1

truncation_symbol = ""

# $read_only montre le cadenas automatiquement lorsque le dossier
# courant n'est pas accessible en écriture pour ton utilisateur.
format = "[$path]($style)[$read_only]($read_only_style) "

style = "bold mauve"
read_only = " "
read_only_style = "bold red"

[git_branch]
# Nom de la branche Git courante.
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold pink"

[git_status]
# Résumé des changements : modifiés, ajoutés, supprimés, en avance ou en retard.
format = "([$all_status$ahead_behind]($style)) "
style = "bold peach"
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"
ahead = "⇡${count}"
behind = "⇣${count}"

[nix_shell]
# Affiche quand un shell Nix (nix-shell ou nix develop) est actif.
symbol = " "
format = "[$symbol$state]($style) "
style = "bold sky"

[python]
# Version de Python, seulement dans un projet Python.
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

[nodejs]
# Version de Node.js, seulement dans un projet Node.
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[rust]
# Version de Rust, seulement dans un projet Rust.
symbol = " "
format = "[$symbol$version]($style) "
style = "bold peach"

[golang]
# Version de Go, seulement dans un projet Go.
symbol = " "
format = "[$symbol$version]($style) "
style = "bold teal"

[jobs]
# Nombre de tâches en arrière-plan.
symbol = " "
format = "[$symbol$number]($style) "
style = "bold lavender"

[status]
# N'affiche le code de sortie que lorsque la commande précédente échoue.
disabled = false
format = "[✘ $status]($style) "
style = "bold red"

[time]
# Heure courante, à droite du prompt.
disabled = false
format = "[$time]($style) "
style = "bold subtext0"
time_format = "%H:%M"

[cmd_duration]
# N'affiche la durée qu'à partir de 500 ms.
min_time = 500
format = "[$duration](bold green) "
show_milliseconds = true

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

