# =========================
# Umbriel config
# Wispie-chan edition 💜
# Mango base + niri shortcuts, scrolling layout
# Noctalia V5 + Aemeath cursor
# Format TOML  ->  ~/.config/umbriel/config.toml
# Check it with:  umbriel config validate
# =========================

###########
# Includes
###########

# Noctalia V5 theme for Umbriel (replaces mango's `source = noctalia.conf`).
# Optional: a missing file is ignored and watched, so it reloads once created.
[include.optional]
files = [
  "~/.config/umbriel/noctalia.toml",
]

###########
# General
###########

[general]
mod_key = "Super"
xwayland = true
show_cheatsheet = false

# Autostart (same as mango's exec_once)
autostart = [
  "noctalia",
  "/home/wisp/.local/bin/polkit-gnome-agent",
  "gsettings set org.gnome.desktop.interface cursor-theme 'Aemeath'",
  "gsettings set org.gnome.desktop.interface cursor-size 24",
  "wl-paste --type text --watch cliphist store",
  "wl-paste --type image --watch cliphist store",
]

###############
# Environment
###############

[environment]
XCURSOR_PATH = "/usr/share/icons:/home/wisp/.local/share/icons"
XCURSOR_THEME = "Aemeath"
XCURSOR_SIZE = "24"
QT_QPA_PLATFORMTHEME = "qt6ct"

###########################
# Keyboard / cursor / focus
###########################

[input.keyboard]
layout = "ch"
variant = "fr"
# Niri setup had two layouts; uncomment for ch(fr) + us with Alt+Shift toggle:
# layout = "ch,us"
# variant = "fr,"
# options = "grp:alt_shift_toggle"

[input.cursor]
theme = "Aemeath"
size = 24
follows_focus = true          # niri: warp-mouse-to-focus

[input.focus]
follows_mouse = true          # niri: focus-follows-mouse
follows_mouse_max_scroll = 0.1

###########################
# Appearance / borders / blur
###########################

[appearance]
border_width = 3
corner_radius = 14

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 6

############
# Layout
############

# Niri-style horizontal scrolling columns.
# (Mango's "tile" would be mode = "master".)
[layout]
mode = "scrolling"
gap = 5            # mango gap_inner = 5

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"

# Mango gap_outer = 10: 5 here on top of the 5 gap. Tweak to taste.
[layout.struts]
left = 5
right = 5
top = 5
bottom = 5

##############
# Window rules
##############

# Blur every window (windows must opt in to blur)
[[window_rule]]
blur = true

# focused_opacity / unfocused_opacity from mango
[[window_rule]]
match.is_focused = true
opacity = 0.92

[[window_rule]]
match.is_focused = false
opacity = 0.75

# Steam games: fullscreen, fully opaque, no blur (from niri config).
# Kept last so opacity = 1.0 wins over the focus rules above.
[[window_rule]]
match.app_id = '^steam_app_[0-9]+$'
default_fullscreen = true
opacity = 1.0
blur = false

##############
# Layer rules
##############

# Blur for Noctalia surfaces. Check names with: umbriel layers
[[layer_rule]]
match.namespace = "^noctalia"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

##########
# Outputs
##########

# Matched by connector, taken from the real Umbriel log:
#   DP-2 offers 143.981 Hz -> Samsung LC24RG50 (left)
#   DP-1 offers 143.992 Hz -> HP OMEN by HP 25 (right)
[output.DP-2]
mode = "1920x1080@143.981"
position = [0, 0]
scale = 1.0
vrr = "always"
workspaces = 10

[output.DP-1]
mode = "1920x1080@143.992"
position = [1920, 0]
scale = 1.0
vrr = "always"
workspaces = 10

#############
# Keybinds
#############

[keybinds]

# --- Noctalia (same as niri) ---
"Mod+Space"        = "spawn:noctalia msg panel-toggle launcher"
"Mod+E"            = "spawn:noctalia msg panel-toggle control-center"
"Mod+O"            = "spawn:noctalia msg settings-toggle"
"Mod+V"            = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+Escape" = "spawn:noctalia msg session-menu-toggle"

# --- DMS fallback ---
"Mod+Alt+Space"        = "spawn:dms ipc call launcher toggle"
"Mod+Alt+E"            = "spawn:dms ipc call controlCenter toggle"
"Mod+Alt+O"            = "spawn:dms ipc call settings toggle"
"Mod+Alt+V"            = "spawn:dms ipc call launcher clipboard"
"Mod+Alt+Shift+Escape" = "spawn:dms ipc call sessionMenu toggle"

# --- Screenshot / recorder ---
"Print"       = "spawn:noctalia msg screenshot-region"
"Mod+Shift+R" = "spawn:noctalia msg plugin noctalia/screen_recorder:service all toggle"

# --- Keyboard layout (only useful with 2+ layouts) ---
"Mod+Shift+L" = "keyboard-layout-next"

# --- Apps / session ---
# Kitty first, then Alacritty, Ghostty, Foot
"Mod+T"       = "spawn:kitty || alacritty || ghostty || foot"
"Mod+Q"       = { action = "window-close", repeat = false }
"Mod+Shift+E" = "session-quit"
"Mod+Ctrl+R"  = "config-reload"     # niri's Mod+R is column width, see below
"Mod+I"       = "overview-toggle"

# --- Focus ---
"Mod+Left"    = "window-focus-left"
"Mod+Right"   = "window-focus-right"
"Mod+Up"      = "window-focus-up"
"Mod+Down"    = "window-focus-down"
"Mod+Tab"     = "window-focus-next"
"Mod+Shift+A" = "window-focus-or-output-left"
"Mod+Shift+D" = "window-focus-or-output-right"

# --- Workspaces: Mod+1..9 (+0 = 10th) ---
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"

# Move column to workspace
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"
"Mod+Ctrl+0" = "column-move-to-workspace:10"

# --- Window state (same as niri) ---
"Mod+W"       = "window-toggle-floating"
"Mod+F"       = "window-toggle-maximize"      # niri: maximize-column
"Mod+Shift+F" = "window-toggle-fullscreen"

# --- Columns (niri) ---
"Mod+BracketLeft"  = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma"        = "window-consume-from-right"   # consume-window-into-column
"Mod+Period"       = "window-move-right"           # expel-window-from-column (approx.)
"Mod+C"            = "column-center"

# Move columns left/right
"Mod+Ctrl+Left"  = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"

# --- Sizing (niri) ---
"Mod+R"           = "window-cycle-primary-extent"    # switch-preset-column-width
"Mod+Minus"       = "window-modify-primary-extent:-0.1"
"Mod+Equal"       = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-height-down:-0.1"
"Mod+Shift+Equal" = "window-modify-height-down:0.1"

# --- Mouse wheel / drag ---
"Mod+WheelUp"         = "window-focus-left"
"Mod+WheelDown"       = "window-focus-right"
"Mod+Shift+WheelUp"   = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"
"Mod+MouseMiddle"     = "layout-scroll-drag"
