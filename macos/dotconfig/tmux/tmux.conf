# ~/.config/tmux/tmux.conf : macOS port of home/multiplexers.nix
#
# Plugins are managed with TPM (https://github.com/tmux-plugins/tpm).
# Install TPM once:  git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press  prefix + I  to install the plugins below.

# ── Plugins ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save / restore sessions (prefix + C-s / C-r)
set -g @plugin 'tmux-plugins/tmux-continuum'   # automatic save, restore on start
set -g @continuum-restore 'on'

# ── Colours (fallback = Rosé Pine, the same palette as the fish prompt) ──
# Noctalia writes ~/.config/tmux/themes/noctalia.conf on a NixOS box. Those
# values override the fallbacks below because the file is sourced last.
set -g @noctalia_primary                "#c4a7e7"
set -g @noctalia_on_primary             "#232136"
set -g @noctalia_surface_container_low  "#2a273f"
set -g @noctalia_surface_container_highest "#393552"
set -g @noctalia_on_surface_variant     "#908caa"

# ── Basics ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"            # 24-bit colour
set -as terminal-features ",*:RGB"
set -sg escape-time 0                         # no lag after Esc (helix, nvim)
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Mouse + clipboard (macOS: pbcopy instead of wl-copy) ───
set -g mouse on
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Status bar: rounded capsules, bottom ────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Name of the app running in the window (Claude / Neovim / OpenCode / command)
set -g @app '#{?#{||:#{m:*claude*,#{pane_current_command}},#{m:*Claude*,#{pane_title}}},Claude,#{?#{||:#{m:nvim,#{pane_current_command}},#{m:vim,#{pane_current_command}}},Neovim,#{?#{m:opencode,#{pane_current_command}},OpenCode,#{pane_current_command}}}}'

set -g status-left "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold]  #S #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold] "

# Styles live in the formats; neutralise the defaults
set -g window-status-style "default"
set -g window-status-last-style "default"
set -g window-status-current-style "default"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold]#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_highest}] #I #{E:@app} #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold]"
set -g window-status-current-format "#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #I #{E:@app} #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold]"

# Optional: live Noctalia colours (only if you use Noctalia on this Mac)
source-file -q ~/.config/tmux/themes/noctalia.conf

# ── Keep last: start TPM (no-op if it is not installed yet) ──
if-shell "test -d ~/.tmux/plugins/tpm" "run-shell '~/.tmux/plugins/tpm/tpm'"
